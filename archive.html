layout: default
title: アーカイブ
permalink: /archive/
description: 年・月・日付の順に選んで日記を読めます。
---

<h1 class="page-title">アーカイブ</h1>
<p class="page-lead">これまでに書いた日記、全 {{ site.posts.size }} 件です。<br>年 → 月 → 日付の順に選ぶと、日記を読めます。</p>

{%- if site.posts.size > 0 %}
<div class="search">
  <label class="search__label" for="entry-search">キーワードで絞り込む</label>
  <input class="search__input" type="search" id="entry-search" placeholder="例：ゼミ、読書、2026" autocomplete="off">
  <p class="search__status" id="search-status" role="status" aria-live="polite"></p>
</div>

{%- include diary-browser.html %}

<script src="{{ '/assets/js/search.js' | relative_url }}" defer></script>
{%- else %}
<p class="empty">まだ日記がありません。</p>
{%- endif %}
